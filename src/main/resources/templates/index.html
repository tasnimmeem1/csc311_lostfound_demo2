<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Campus Lost &amp; Found</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1   { color: green; }
  </style>
</head>
<body>
  <h1>Campus Lost &amp; Found</h1>
  <p>Signed in as <span th:text="${username}"></span></p>
  <form th:action="@{/logout}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Sign out</button>
  </form>

  <!-- Items come from /api/items -->
  <ul id="items"></ul>

  <h2>Found something?</h2>
  <form id="reportForm">
    <p><input id="title" placeholder="What is it?"></p>
    <p><input id="location" placeholder="Where did you find it?"></p>
    <button type="submit">Report item</button>
  </form>

  <script>
    async function loadItems() {
      const items = await fetch("/api/items").then(r => r.json());
      const list = document.getElementById("items");
      list.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item.title + " – " + item.location;
        list.appendChild(li);
      }
    }

    document.getElementById("reportForm").addEventListener("submit", async event => {
      event.preventDefault();
      const item = {
        title: document.getElementById("title").value,
        location: document.getElementById("location").value
      };
      const csrfToken = document.querySelector('meta[name="_csrf"]').content;
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
      await fetch("/api/items", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          [csrfHeader]: csrfToken
        },
        body: JSON.stringify(item)
      });
      event.target.reset();
      loadItems();
    });

    loadItems();
  </script>
</body>
</html>
