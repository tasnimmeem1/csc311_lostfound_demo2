<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Campus Lost &amp; Found</title>
</head>
<body>
  <main>
    <h1>Sign in</h1>

    <p th:if="${param.registered}">Account created. Please sign in.</p>
    <p th:if="${param.error}">Wrong username or password.</p>
    <p th:if="${param.logout}">You have signed out.</p>

    <form th:action="@{/login}" method="post">
      <p>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </p>
      <p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </p>
      <button type="submit">Sign in</button>
    </form>

    <p><a th:href="@{/register}">Create an account</a></p>
  </main>
</body>
</html>
